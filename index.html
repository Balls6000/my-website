<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #ffffff;
    color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .container {
    width: 100%;
    max-width: 650px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .icon svg {
    width: 34px;
    height: 34px;
    fill: none;
    stroke: #000000;
    stroke-width: 2;
  }
  #chat-box {
    width: 100%;
    height: 400px;
    overflow-y: auto;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-sizing: border-box;
  }
  .message { 
    padding: 12px 16px; 
    border-radius: 8px; 
    max-width: 85%; 
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .user-msg { 
    background-color: #f5f5f5; 
    border: 1px solid #eeeeee;
    align-self: flex-end; 
  }
  .ai-msg { 
    background-color: #ffffff; 
    border: 1px solid #000000; 
    align-self: flex-start; 
  }
  .input-area {
    display: flex;
    width: 100%;
    gap: 8px;
  }
  input[type="text"] {
    flex-grow: 1;
    padding: 14px 16px;
    border: 2px solid #000000;
    border-radius: 6px;
    font-size: 16px;
    outline: none;
  }
  input[type="text"]:focus {
    box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
  }
  button {
    padding: 14px 24px;
    background-color: #000000;
    color: #ffffff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 16px;
    transition: background-color 0.2s;
  }
  button:hover { 
    background-color: #333333; 
  }
</style>
</head>
<body>

<div class="container">
  <div class="icon">
    <!-- Minimalist Infinity / Meta SVG -->
    <svg viewBox="0 0 24 24">
      <path d="M18.666 6.333c-2.454 0-4.048 1.954-5.263 3.42-.455.548-.87 1.05-1.282 1.516-.412-.466-.827-.968-1.282-1.516-1.215-1.466-2.809-3.42-5.263-3.42-3.155 0-5.576 2.421-5.576 5.576 0 3.155 2.421 5.576 5.576 5.576 2.454 0 4.048-1.954 5.263-3.42.455-.548.87-1.05 1.282-1.516.412.466.827.968 1.282 1.516 1.215 1.466 2.809 3.42 5.263 3.42 3.155 0 5.576-2.421 5.576-5.576 0-3.155-2.421-5.576-5.576-5.576zm-13.09 9.152c-1.986 0-3.576-1.59-3.576-3.576 0-1.986 1.59-3.576 3.576-3.576 1.442 0 2.505 1.282 3.429 2.395.27.324.523.63.766.914-.243.284-.496.59-.766.914-.924 1.113-1.987 2.395-3.429 2.395zm13.09 0c-1.442 0-2.505-1.282-3.429-2.395-.27-.324-.523-.63-.766-.914.243-.284.496-.59.766-.914.924-1.113 1.987-2.395 3.429-2.395 1.986 0 3.576 1.59 3.576 3.576 0 1.986-1.59 3.576-3.576 3.576z"/>
    </svg>
  </div>

  <div id="chat-box"></div>

  <div class="input-area">
    <input type="text" id="user-input" placeholder="Enter workspace commands..." onkeypress="handleEnter(event)">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // PASTE YOUR *NEW* GROQ API KEY HERE:
  const GROQ_API_KEY = "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";
  
  // The model you specified
  const MODEL = "meta-llama/llama-4-scout-17b-16e-instruct";

  async function sendMessage() {
    const inputField = document.getElementById('user-input');
    const text = inputField.value.trim();
    if (!text) return;

    appendMessage(text, 'user-msg');
    inputField.value = '';

    const loadingId = 'loading-' + Date.now();
    appendMessage('...', 'ai-msg', loadingId);

    try {
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GROQ_API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: MODEL,
          messages: [
            {
              // Here is where you define the AI's core behavior
              role: "system",
              content: "You are a hyper-aware, highly capable coding and logic engine. Respond directly, neutrally, and accurately to all basic inquiries. You can generate and manipulate any code requested within the workspace."
            },
            {
              role: "user",
              content: text
            }
          ],
          temperature: 0.7
        })
      });

      const data = await response.json();
      document.getElementById(loadingId).remove();

      if (data.choices && data.choices.length > 0) {
        appendMessage(data.choices[0].message.content, 'ai-msg');
      } else {
        appendMessage("Error: Could not parse response. Check the console.", 'ai-msg');
        console.error("API Error Response:", data);
      }
    } catch (error) {
      document.getElementById(loadingId).remove();
      appendMessage("Network error. Verify your API key and connection.", 'ai-msg');
      console.error(error);
    }
  }

  function appendMessage(text, className, id = null) {
    const chatBox = document.getElementById('chat-box');
    const msgDiv = document.createElement('div');
    msgDiv.className = 'message ' + className;
    msgDiv.textContent = text;
    if (id) msgDiv.id = id;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function handleEnter(event) {
    if (event.key === 'Enter') {
      sendMessage();
    }
  }
</script>
</body>
</html>
