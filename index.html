<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕹️ NEON ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --neon-cyan: #00f5ff;
    --neon-pink: #ff0080;
    --neon-yellow: #ffff00;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --neon-orange: #ff6600;
    --dark: #050510;
    --darker: #020208;
    --card-bg: #0a0a1f;
    --card-border: #1a1a3e;
    --text: #e0e0ff;
    --text-dim: #7070a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--dark); color: var(--text); font-family: 'Share Tech Mono', monospace; overflow-x: hidden; }

  /* Scanline effect */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
  }

  /* Stars background */
  #stars { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .star { position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; animation: twinkle var(--d, 3s) infinite alternate; opacity: var(--o, 0.5); }
  @keyframes twinkle { from { opacity: var(--o, .5); } to { opacity: calc(var(--o, .5) * 0.2); } }

  /* Header */
  header {
    position: relative; z-index: 10; text-align: center;
    padding: 3rem 2rem 2rem;
    border-bottom: 1px solid var(--neon-cyan);
    box-shadow: 0 2px 30px rgba(0,245,255,0.15);
  }
  .logo {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.5rem, 5vw, 3.5rem);
    letter-spacing: 0.1em;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 30px var(--neon-cyan), 0 0 60px rgba(0,245,255,0.4);
    animation: flicker 4s infinite;
    line-height: 1.4;
  }
  .logo span { color: var(--neon-pink); text-shadow: 0 0 10px var(--neon-pink), 0 0 30px var(--neon-pink); }
  @keyframes flicker {
    0%,94%,96%,100% { opacity: 1; }
    95% { opacity: 0.85; }
  }
  .tagline { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; color: var(--text-dim); letter-spacing: 0.4em; margin-top: 1rem; text-transform: uppercase; }

  /* Stats bar */
  .stats-bar {
    display: flex; justify-content: center; gap: 3rem; flex-wrap: wrap;
    padding: 1rem 2rem; background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--card-border);
    position: relative; z-index: 10;
  }
  .stat { text-align: center; }
  .stat-val { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); }
  .stat-lbl { font-size: 0.65rem; color: var(--text-dim); letter-spacing: 0.1em; margin-top: 2px; }

  /* Game grid */
  main { position: relative; z-index: 10; padding: 2.5rem 2rem; max-width: 1300px; margin: 0 auto; }
  .section-title {
    font-family: 'Press Start 2P', monospace; font-size: 0.8rem;
    color: var(--neon-green); letter-spacing: 0.2em;
    text-shadow: 0 0 8px var(--neon-green);
    margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--neon-green), transparent); opacity: 0.4; }

  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  .game-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
  }
  .game-card:hover {
    transform: translateY(-4px) scale(1.02);
    border-color: var(--card-accent);
    box-shadow: 0 8px 30px color-mix(in srgb, var(--card-accent) 30%, transparent);
  }
  .game-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, color-mix(in srgb, var(--card-accent) 5%, transparent), transparent);
    pointer-events: none;
  }
  .game-preview {
    height: 160px; display: flex; align-items: center; justify-content: center;
    font-size: 5rem; position: relative; overflow: hidden;
    background: radial-gradient(ellipse at center, color-mix(in srgb, var(--card-accent) 15%, transparent), transparent 70%);
  }
  .game-preview .pixel-art { animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .badge {
    position: absolute; top: 10px; right: 10px;
    font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
    padding: 4px 8px; border-radius: 2px;
    border: 1px solid; letter-spacing: 0.05em;
  }
  .badge-hot { color: var(--neon-orange); border-color: var(--neon-orange); background: rgba(255,102,0,0.1); }
  .badge-new { color: var(--neon-green); border-color: var(--neon-green); background: rgba(57,255,20,0.1); }
  .badge-hard { color: var(--neon-pink); border-color: var(--neon-pink); background: rgba(255,0,128,0.1); }

  .game-info { padding: 1.2rem; }
  .game-name {
    font-family: 'Press Start 2P', monospace; font-size: 0.65rem;
    color: var(--card-accent); text-shadow: 0 0 6px var(--card-accent);
    letter-spacing: 0.05em; margin-bottom: 0.6rem; line-height: 1.6;
  }
  .game-desc { font-size: 0.75rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 1rem; }
  .game-meta { display: flex; gap: 1rem; align-items: center; }
  .difficulty { font-size: 0.6rem; color: var(--text-dim); }
  .stars { color: var(--neon-yellow); font-size: 0.7rem; text-shadow: 0 0 4px var(--neon-yellow); }
  .play-btn {
    margin-left: auto; padding: 6px 14px;
    font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
    background: transparent; border: 1px solid var(--card-accent);
    color: var(--card-accent); border-radius: 2px; cursor: pointer;
    transition: all 0.15s; letter-spacing: 0.05em;
  }
  .play-btn:hover { background: var(--card-accent); color: var(--dark); box-shadow: 0 0 12px var(--card-accent); }

  /* Modal overlay */
  #modal {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.92);
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #modal.open { display: flex; }
  .modal-box {
    background: var(--card-bg); border: 1px solid var(--modal-accent, var(--neon-cyan));
    box-shadow: 0 0 40px color-mix(in srgb, var(--modal-accent, var(--neon-cyan)) 30%, transparent);
    border-radius: 4px; width: 95vw; max-width: 700px;
    max-height: 95vh; overflow: hidden; display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--card-border);
    background: rgba(0,0,0,0.4);
  }
  .modal-title {
    font-family: 'Press Start 2P', monospace; font-size: 0.7rem;
    color: var(--modal-accent, var(--neon-cyan));
    text-shadow: 0 0 8px var(--modal-accent, var(--neon-cyan));
    letter-spacing: 0.1em; flex: 1;
  }
  .modal-score {
    font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 700;
    color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow);
  }
  #close-btn {
    width: 32px; height: 32px; border: 1px solid var(--card-border);
    background: transparent; color: var(--text-dim); font-size: 1.2rem;
    cursor: pointer; border-radius: 2px; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; font-family: monospace;
  }
  #close-btn:hover { color: var(--neon-pink); border-color: var(--neon-pink); }
  .modal-body { flex: 1; overflow-y: auto; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .modal-controls {
    padding: 0.75rem 1.5rem; border-top: 1px solid var(--card-border);
    background: rgba(0,0,0,0.4); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
  }
  .ctrl-hint { font-size: 0.65rem; color: var(--text-dim); }
  .ctrl-key {
    display: inline-block; padding: 2px 6px; border: 1px solid var(--card-border);
    border-radius: 2px; font-size: 0.6rem; color: var(--text);
    background: rgba(255,255,255,0.05); margin: 0 2px;
  }
  .modal-action-btn {
    margin-left: auto; padding: 6px 14px;
    font-family: 'Press Start 2P', monospace; font-size: 0.5rem;
    background: transparent; border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan); border-radius: 2px; cursor: pointer;
    transition: all 0.15s;
  }
  .modal-action-btn:hover { background: var(--neon-cyan); color: var(--dark); }

  canvas { display: block; image-rendering: pixelated; }

  /* Footer */
  footer {
    position: relative; z-index: 10; text-align: center;
    padding: 2rem; border-top: 1px solid var(--card-border);
    color: var(--text-dim); font-size: 0.7rem; line-height: 2;
  }
  .footer-logo { font-family: 'Press Start 2P', monospace; font-size: 0.6rem; color: var(--neon-cyan); margin-bottom: 0.5rem; }

  /* 2048 specific */
  .g2048-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: #1a1a3e; padding: 10px; border-radius: 4px; width: 340px; height: 340px; }
  .g2048-cell {
    border-radius: 3px; display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-weight: 700;
    transition: all 0.12s ease; font-size: 1.2rem;
  }
  .g2048-cell[data-v="0"] { background: #0a0a1f; }
  .g2048-cell[data-v="2"] { background: #1a1a4f; color: #aaaaff; font-size: 1.4rem; }
  .g2048-cell[data-v="4"] { background: #1a2a5f; color: #8888ff; font-size: 1.4rem; }
  .g2048-cell[data-v="8"] { background: #0a3a6f; color: #00f5ff; font-size: 1.2rem; text-shadow: 0 0 8px #00f5ff; }
  .g2048-cell[data-v="16"] { background: #0a2a7f; color: #00aaff; font-size: 1.1rem; text-shadow: 0 0 8px #00aaff; }
  .g2048-cell[data-v="32"] { background: #3a0a7f; color: #bf00ff; font-size: 1rem; text-shadow: 0 0 8px #bf00ff; }
  .g2048-cell[data-v="64"] { background: #5a0a8f; color: #ff00ff; font-size: 1rem; text-shadow: 0 0 8px #ff00ff; }
  .g2048-cell[data-v="128"] { background: #7f0a4f; color: #ff0080; font-size: 0.9rem; text-shadow: 0 0 8px #ff0080; }
  .g2048-cell[data-v="256"] { background: #8f2a0a; color: #ff4400; font-size: 0.85rem; text-shadow: 0 0 8px #ff4400; }
  .g2048-cell[data-v="512"] { background: #8f5a0a; color: #ff8800; font-size: 0.85rem; text-shadow: 0 0 8px #ff8800; }
  .g2048-cell[data-v="1024"] { background: #6f6f0a; color: #ffff00; font-size: 0.75rem; text-shadow: 0 0 8px #ffff00; }
  .g2048-cell[data-v="2048"] { background: #3fff3f; color: #004f00; font-size: 0.75rem; }

  /* Memory game */
  .memory-board { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; width: 340px; }
  .mem-card {
    width: 72px; height: 72px; border: 1px solid var(--card-border);
    border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 2rem; transition: all 0.3s; position: relative;
    background: #0a0a2f; transform-style: preserve-3d;
  }
  .mem-card.flipped, .mem-card.matched { transform: rotateY(180deg); }
  .mem-card.flipped { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,245,255,0.3); }
  .mem-card.matched { border-color: var(--neon-green); box-shadow: 0 0 10px rgba(57,255,20,0.3); }
  .mem-card-front, .mem-card-back {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; border-radius: 4px;
  }
  .mem-card-front { background: #0a0a2f; font-size: 1.5rem; color: var(--neon-cyan); }
  .mem-card-back { background: #0a1a2f; transform: rotateY(180deg); }

  /* Whack-a-mole */
  .wam-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 15px; padding: 10px; }
  .hole {
    width: 100px; height: 100px; border-radius: 50%; background: #1a0a0a;
    border: 2px solid #3a1a1a; display: flex; align-items: center; justify-content: center;
    font-size: 3rem; cursor: pointer; position: relative; overflow: hidden;
    transition: all 0.1s;
  }
  .hole.active { border-color: var(--neon-orange); box-shadow: 0 0 15px rgba(255,102,0,0.4); }
  .mole { transition: transform 0.1s; transform: translateY(100%); }
  .hole.active .mole { transform: translateY(0); }
  .hole:hover.active { transform: scale(0.95); }

  .game-over-screen {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    border-radius: 4px; z-index: 20;
  }
  .go-title { font-family: 'Press Start 2P', monospace; font-size: 1.2rem; color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }
  .go-score { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--neon-yellow); }
  .go-btn {
    font-family: 'Press Start 2P', monospace; font-size: 0.6rem; padding: 10px 20px;
    background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green);
    cursor: pointer; border-radius: 2px; transition: all 0.15s; margin-top: 0.5rem;
  }
  .go-btn:hover { background: var(--neon-green); color: var(--dark); box-shadow: 0 0 15px var(--neon-green); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--darker); }
  ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

  @media (max-width: 600px) {
    .games-grid { grid-template-columns: 1fr; }
    .g2048-board, .memory-board { width: 280px; }
    .g2048-cell { font-size: 1rem; }
    .mem-card { width: 56px; height: 56px; }
    .hole { width: 80px; height: 80px; font-size: 2.2rem; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<header>
  <div class="logo">🕹️ NEON <span>ARCADE</span></div>
  <div class="tagline">INSERT COIN TO CONTINUE — 10 GAMES ONLINE</div>
</header>

<div class="stats-bar">
  <div class="stat"><div class="stat-val" id="total-score">000000</div><div class="stat-lbl">TOTAL SCORE</div></div>
  <div class="stat"><div class="stat-val" id="games-played">00</div><div class="stat-lbl">GAMES PLAYED</div></div>
  <div class="stat"><div class="stat-val">10</div><div class="stat-lbl">GAMES AVAILABLE</div></div>
  <div class="stat"><div class="stat-val" id="hi-score">000000</div><div class="stat-lbl">HI-SCORE</div></div>
</div>

<main>
  <div class="section-title">SELECT YOUR GAME</div>
  <div class="games-grid" id="games-grid"></div>
</main>

<footer>
  <div class="footer-logo">NEON ARCADE v1.0</div>
  <div>ALL GAMES PLAYABLE IN BROWSER · NO DOWNLOADS · NO ADS</div>
  <div style="margin-top:0.5rem;color:#3a3a5a;">Press <span class="ctrl-key">ESC</span> to close any game</div>
</footer>

<!-- Modal -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">GAME</div>
      <div class="modal-score" id="modal-score">0</div>
      <button id="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-controls" id="modal-controls"></div>
  </div>
</div>

<script>
// ─── Stars ───────────────────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i = 0; i < 120; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;--o:${0.2+Math.random()*0.8};`;
  starsEl.appendChild(s);
}

// ─── Game Definitions ─────────────────────────────────────────────────────────
const GAMES = [
  { id:'snake',    name:'SNAKE',         icon:'🐍', color:'#39ff14', badge:'HOT',  diff:'★★☆', desc:'Classic snake — eat, grow, survive. How long can you last?',    controls:'<span class="ctrl-key">↑↓←→</span> or <span class="ctrl-key">WASD</span> to move' },
  { id:'tetris',   name:'TETRIS',        icon:'🟦', color:'#00f5ff', badge:'HOT',  diff:'★★★', desc:'Stack falling blocks to clear lines and beat your high score.',   controls:'<span class="ctrl-key">←→</span> move · <span class="ctrl-key">↑</span> rotate · <span class="ctrl-key">↓</span> drop · <span class="ctrl-key">Space</span> hard drop' },
  { id:'pong',     name:'PONG',          icon:'🏓', color:'#ffffff', badge:'',     diff:'★☆☆', desc:'Classic paddle game vs a cunning AI. First to 7 wins!',          controls:'<span class="ctrl-key">↑↓</span> or <span class="ctrl-key">WS</span> to move paddle' },
  { id:'invaders', name:'SPACE INVADERS',icon:'👾', color:'#bf00ff', badge:'NEW',  diff:'★★★', desc:'Defend Earth from waves of alien invaders raining destruction.',  controls:'<span class="ctrl-key">←→</span> move · <span class="ctrl-key">Space</span> shoot' },
  { id:'breakout', name:'BREAKOUT',      icon:'🧱', color:'#ff6600', badge:'',     diff:'★★☆', desc:'Bounce the ball to smash all bricks. Don\'t let it fall!',       controls:'<span class="ctrl-key">←→</span> or mouse/touch to move paddle' },
  { id:'flappy',   name:'FLAPPY BIRD',   icon:'🐦', color:'#ffff00', badge:'HARD', diff:'★★★', desc:'Tap to flap through pipes. One tap, one chance at glory.',       controls:'<span class="ctrl-key">Space</span> or click to flap' },
  { id:'g2048',    name:'2048',          icon:'🔢', color:'#ff0080', badge:'',     diff:'★★☆', desc:'Merge tiles to reach 2048. Strategic thinking required!',        controls:'<span class="ctrl-key">↑↓←→</span> to shift tiles' },
  { id:'memory',   name:'MEMORY MATCH',  icon:'🃏', color:'#00f5ff', badge:'',     diff:'★☆☆', desc:'Flip cards and find matching pairs. Beat it in fewer moves!',    controls:'Click cards to flip them' },
  { id:'wam',      name:'WHACK-A-MOLE',  icon:'🔨', color:'#ff6600', badge:'HOT',  diff:'★☆☆', desc:'Smack those moles as fast as they pop up! 30 seconds of chaos.', controls:'Click moles to whack them' },
  { id:'maze',     name:'MAZE RUNNER',   icon:'🌀', color:'#bf00ff', badge:'NEW',  diff:'★★☆', desc:'Navigate through a randomly generated maze to the exit.',        controls:'<span class="ctrl-key">↑↓←→</span> or <span class="ctrl-key">WASD</span> to move' },
];

let totalScore = 0, gamesPlayed = 0, hiScore = 0;
let currentGame = null;

function pad(n, l=6) { return String(n).padStart(l,'0'); }
function updateStats(s) {
  totalScore += s; gamesPlayed++;
  if (s > hiScore) hiScore = s;
  document.getElementById('total-score').textContent = pad(totalScore);
  document.getElementById('games-played').textContent = pad(gamesPlayed, 2);
  document.getElementById('hi-score').textContent = pad(hiScore);
}

// ─── Render Grid ──────────────────────────────────────────────────────────────
const grid = document.getElementById('games-grid');
GAMES.forEach(g => {
  const bc = {'HOT':'badge-hot','NEW':'badge-new','HARD':'badge-hard'}[g.badge]||'';
  grid.innerHTML += `
  <div class="game-card" style="--card-accent:${g.color}" onclick="openGame('${g.id}')">
    <div class="game-preview">
      <div class="pixel-art">${g.icon}</div>
      ${g.badge?`<div class="badge ${bc}">${g.badge}</div>`:''}
    </div>
    <div class="game-info">
      <div class="game-name">${g.name}</div>
      <div class="game-desc">${g.desc}</div>
      <div class="game-meta">
        <div class="difficulty">${g.diff}</div>
        <div class="stars">★★★</div>
        <button class="play-btn" onclick="event.stopPropagation();openGame('${g.id}')">▶ PLAY</button>
      </div>
    </div>
  </div>`;
});

// ─── Modal ────────────────────────────────────────────────────────────────────
const modal = document.getElementById('modal');
function openGame(id) {
  const g = GAMES.find(x=>x.id===id);
  modal.style.setProperty('--modal-accent', g.color);
  document.getElementById('modal-title').textContent = g.name;
  document.getElementById('modal-score').textContent = '0';
  document.getElementById('modal-controls').innerHTML =
    `<span class="ctrl-hint">${g.controls}</span>
     <button class="modal-action-btn" onclick="restartGame()">↺ RESTART</button>`;
  document.getElementById('modal-body').innerHTML = '';
  modal.classList.add('open');
  currentGame = id;
  if (currentGame === 'snake')    initSnake();
  else if (currentGame === 'tetris')   initTetris();
  else if (currentGame === 'pong')     initPong();
  else if (currentGame === 'invaders') initInvaders();
  else if (currentGame === 'breakout') initBreakout();
  else if (currentGame === 'flappy')   initFlappy();
  else if (currentGame === 'g2048')    init2048();
  else if (currentGame === 'memory')   initMemory();
  else if (currentGame === 'wam')      initWam();
  else if (currentGame === 'maze')     initMaze();
}
function closeModal() {
  modal.classList.remove('open');
  if (window._gameTimer) clearInterval(window._gameTimer);
  if (window._raf) cancelAnimationFrame(window._raf);
  window._gameTimer = null; window._raf = null;
  document.removeEventListener('keydown', window._keyHandler);
  window._keyHandler = null;
  currentGame = null;
}
function restartGame() { const g = currentGame; closeModal(); setTimeout(()=>openGame(g),50); }
function setScore(s) { document.getElementById('modal-score').textContent = pad(s); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// 1. SNAKE
// ══════════════════════════════════════════════════════════════════════════════
function initSnake() {
  const W=400,H=400,S=20;
  const body = document.getElementById('modal-body');
  body.innerHTML = '<div style="position:relative"><canvas id="sc" width="400" height="400"></canvas><div id="snake-go" style="display:none" class="game-over-screen"><div class="go-title">GAME OVER</div><div class="go-score" id="snake-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>';
  const cv = document.getElementById('sc');
  const ctx = cv.getContext('2d');
  let snake=[{x:10,y:10}],dir={x:1,y:0},next={x:1,y:0},food=null,score=0,running=true;
  function rndFood(){
    let f;
    do{f={x:Math.floor(Math.random()*(W/S)),y:Math.floor(Math.random()*(H/S))}}
    while(snake.some(s=>s.x===f.x&&s.y===f.y));
    return f;
  }
  food=rndFood();
  function draw(){
    ctx.fillStyle='#050510'; ctx.fillRect(0,0,W,H);
    // grid
    ctx.strokeStyle='rgba(0,245,255,0.04)';
    for(let x=0;x<W;x+=S){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=S){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // food
    ctx.fillStyle='#ff0080';
    ctx.shadowColor='#ff0080'; ctx.shadowBlur=15;
    ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);
    ctx.shadowBlur=0;
    // snake
    snake.forEach((s,i)=>{
      const t = i/snake.length;
      ctx.fillStyle=`hsl(${140-t*40},100%,${50-t*20}%)`;
      if(i===0){ctx.shadowColor='#39ff14';ctx.shadowBlur=10;}
      ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);
      ctx.shadowBlur=0;
    });
  }
  function step(){
    if(!running)return;
    dir=next;
    const head={x:(snake[0].x+dir.x+W/S)%(W/S),y:(snake[0].y+dir.y+H/S)%(H/S)};
    if(snake.some(s=>s.x===head.x&&s.y===head.y)){
      running=false;
      document.getElementById('snake-goscore').textContent=pad(score);
      document.getElementById('snake-go').style.display='flex';
      updateStats(score); return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){ score+=10; setScore(score); food=rndFood(); }
    else snake.pop();
    draw();
  }
  draw();
  window._gameTimer = setInterval(step, 120);
  window._keyHandler = e=>{
    if(['ArrowUp','w','W'].includes(e.key)&&dir.y===0)next={x:0,y:-1};
    else if(['ArrowDown','s','S'].includes(e.key)&&dir.y===0)next={x:0,y:1};
    else if(['ArrowLeft','a','A'].includes(e.key)&&dir.x===0)next={x:-1,y:0};
    else if(['ArrowRight','d','D'].includes(e.key)&&dir.x===0)next={x:1,y:0};
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  };
  document.addEventListener('keydown',window._keyHandler);
}

// ══════════════════════════════════════════════════════════════════════════════
// 2. TETRIS
// ══════════════════════════════════════════════════════════════════════════════
function initTetris() {
  const W=10,H=20,S=24;
  const PIECES=[
    {shape:[[1,1,1,1]],color:'#00f5ff'},
    {shape:[[1,1],[1,1]],color:'#ffff00'},
    {shape:[[1,1,1],[0,1,0]],color:'#bf00ff'},
    {shape:[[1,1,1],[1,0,0]],color:'#ff6600'},
    {shape:[[1,1,1],[0,0,1]],color:'#0055ff'},
    {shape:[[1,1,0],[0,1,1]],color:'#39ff14'},
    {shape:[[0,1,1],[1,1,0]],color:'#ff0080'},
  ];
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;gap:16px;align-items:flex-start">
      <div style="position:relative"><canvas id="tc" width="${W*S}" height="${H*S}"></canvas>
      <div id="tetris-go" style="display:none" class="game-over-screen"><div class="go-title">GAME OVER</div><div class="go-score" id="tetris-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#0a0a1f;border:1px solid #1a1a3e;padding:10px;border-radius:3px">
          <div style="font-size:0.6rem;color:#7070a0;margin-bottom:4px">NEXT</div>
          <canvas id="tnext" width="80" height="80"></canvas>
        </div>
        <div style="background:#0a0a1f;border:1px solid #1a1a3e;padding:10px;border-radius:3px">
          <div style="font-size:0.6rem;color:#7070a0">LEVEL</div>
          <div style="font-family:Orbitron,sans-serif;color:#ffff00;font-size:1.2rem;font-weight:700" id="tlevel">1</div>
        </div>
        <div style="background:#0a0a1f;border:1px solid #1a1a3e;padding:10px;border-radius:3px">
          <div style="font-size:0.6rem;color:#7070a0">LINES</div>
          <div style="font-family:Orbitron,sans-serif;color:#00f5ff;font-size:1.2rem;font-weight:700" id="tlines">0</div>
        </div>
      </div>
    </div>`;
  const cv=document.getElementById('tc'), ctx=cv.getContext('2d');
  const nx=document.getElementById('tnext'), nctx=nx.getContext('2d');
  let board=Array.from({length:H},()=>Array(W).fill(0));
  let cur=null,next=null,score=0,lines=0,level=1,running=true;
  function rndPiece(){return PIECES[Math.floor(Math.random()*PIECES.length)];}
  function newPiece(p){return{shape:p.shape,color:p.color,x:Math.floor(W/2)-Math.floor(p.shape[0].length/2),y:0};}
  function valid(s,ox,oy){
    return s.every((r,y)=>r.every((c,x)=>!c||(s[y][x]&&ox+x>=0&&ox+x<W&&oy+y<H&&!board[oy+y]?.[ox+x])));
  }
  function place(){
    cur.shape.forEach((r,y)=>r.forEach((c,x)=>{if(c)board[cur.y+y][cur.x+x]=cur.color;}));
    let cleared=0;
    board=board.filter(r=>{if(r.every(c=>c)){cleared++;return false;}return true;});
    while(board.length<H)board.unshift(Array(W).fill(0));
    if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=Math.floor(lines/10)+1;
      setScore(score);document.getElementById('tlevel').textContent=level;document.getElementById('tlines').textContent=lines;}
    cur=newPiece(next);next=rndPiece();
    if(!valid(cur.shape,cur.x,cur.y)){running=false;document.getElementById('tetris-goscore').textContent=pad(score);document.getElementById('tetris-go').style.display='flex';updateStats(score);}
  }
  function rotate(s){return s[0].map((_,i)=>s.map(r=>r[i]).reverse());}
  function drawB(){
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W*S,H*S);
    ctx.strokeStyle='rgba(0,245,255,0.04)';
    for(let x=0;x<W;x++){for(let y=0;y<H;y++){ctx.strokeRect(x*S,y*S,S,S);}}
    board.forEach((r,y)=>r.forEach((c,x)=>{if(c){ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=4;ctx.fillRect(x*S+1,y*S+1,S-2,S-2);ctx.shadowBlur=0;}}));
    if(cur){
      // ghost
      let gy=cur.y;
      while(valid(cur.shape,cur.x,gy+1))gy++;
      cur.shape.forEach((r,y)=>r.forEach((c,x)=>{if(c){ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect((cur.x+x)*S+1,(gy+y)*S+1,S-2,S-2);}}));
      cur.shape.forEach((r,y)=>r.forEach((c,x)=>{if(c){ctx.fillStyle=cur.color;ctx.shadowColor=cur.color;ctx.shadowBlur=6;ctx.fillRect((cur.x+x)*S+1,(cur.y+y)*S+1,S-2,S-2);ctx.shadowBlur=0;}}));
    }
  }
  function drawN(){
    nctx.fillStyle='#0a0a1f';nctx.fillRect(0,0,80,80);
    if(next){const os=8,cs=16;next.shape.forEach((r,y)=>r.forEach((c,x)=>{if(c){nctx.fillStyle=next.color;nctx.fillRect(os+x*cs,os+y*cs,cs-2,cs-2);}}));}
  }
  next=rndPiece();cur=newPiece(rndPiece());next=rndPiece();
  function loop(){
    if(!running)return;
    if(!valid(cur.shape,cur.x,cur.y+1))place();
    else cur.y++;
    drawB();drawN();
    window._gameTimer=setTimeout(loop,Math.max(50,500-level*40));
  }
  window._keyHandler=e=>{
    if(!running)return;
    if(['ArrowLeft','a','A'].includes(e.key)&&valid(cur.shape,cur.x-1,cur.y))cur.x--;
    else if(['ArrowRight','d','D'].includes(e.key)&&valid(cur.shape,cur.x+1,cur.y))cur.x++;
    else if(['ArrowDown','s','S'].includes(e.key)&&valid(cur.shape,cur.x,cur.y+1))cur.y++;
    else if(['ArrowUp','w','W'].includes(e.key)){const r=rotate(cur.shape);if(valid(r,cur.x,cur.y))cur.shape=r;}
    else if(e.key===' '){while(valid(cur.shape,cur.x,cur.y+1))cur.y++;place();}
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
    drawB();drawN();
  };
  document.addEventListener('keydown',window._keyHandler);
  loop();
}

// ══════════════════════════════════════════════════════════════════════════════
// 3. PONG
// ══════════════════════════════════════════════════════════════════════════════
function initPong() {
  const W=500,H=350,PS=70,PW=10,BR=7;
  document.getElementById('modal-body').innerHTML=`<div style="position:relative"><canvas id="pc" width="${W}" height="${H}"></canvas></div>`;
  const cv=document.getElementById('pc'),ctx=cv.getContext('2d');
  let p1y=H/2-PS/2,p2y=H/2-PS/2,by=H/2,bx=W/2,vx=4,vy=3,s1=0,s2=0,running=true;
  let upKey=false,downKey=false;
  window._keyHandler=e=>{
    if(['ArrowUp','w','W'].includes(e.key))upKey=true;
    if(['ArrowDown','s','S'].includes(e.key))downKey=true;
    if(['ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();
  };
  const ku=e=>{if(['ArrowUp','w','W'].includes(e.key))upKey=false;if(['ArrowDown','s','S'].includes(e.key))downKey=false;};
  document.addEventListener('keydown',window._keyHandler);
  document.addEventListener('keyup',ku);
  function draw(){
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    // center line
    ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    // scores
    ctx.font="bold 2rem 'Orbitron',sans-serif";ctx.textAlign='center';
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillText(s1,W/4,50);ctx.fillText(s2,3*W/4,50);
    // paddles
    ctx.fillStyle='#00f5ff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=10;
    ctx.fillRect(20,p1y,PW,PS);
    ctx.fillStyle='#ff0080';ctx.shadowColor='#ff0080';
    ctx.fillRect(W-20-PW,p2y,PW,PS);
    ctx.shadowBlur=0;
    // ball
    ctx.beginPath();ctx.arc(bx,by,BR,0,Math.PI*2);
    ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;
  }
  function loop(){
    if(!running)return;
    // player
    if(upKey)p1y=Math.max(0,p1y-5);
    if(downKey)p1y=Math.min(H-PS,p1y+5);
    // AI
    const ai=p2y+PS/2;const diff=by-ai;p2y+=Math.sign(diff)*Math.min(Math.abs(diff)*0.06+1,4);
    p2y=Math.max(0,Math.min(H-PS,p2y));
    // ball
    bx+=vx;by+=vy;
    if(by-BR<=0||by+BR>=H)vy*=-1;
    if(bx-BR<=30+PW&&by>=p1y&&by<=p1y+PS){vx=Math.abs(vx)*1.03;vy+=(by-(p1y+PS/2))*0.1;}
    if(bx+BR>=W-30-PW&&by>=p2y&&by<=p2y+PS){vx=-Math.abs(vx)*1.03;vy+=(by-(p2y+PS/2))*0.1;}
    vx=Math.max(-10,Math.min(10,vx));vy=Math.max(-8,Math.min(8,vy));
    if(bx<0){s2++;setScore(s2);bx=W/2;by=H/2;vx=4;vy=3;}
    if(bx>W){s1++;setScore(s1);bx=W/2;by=H/2;vx=-4;vy=3;}
    if(s1>=7||s2>=7){running=false;updateStats(s1*100);}
    draw();
    window._raf=requestAnimationFrame(loop);
  }
  draw();loop();
}

// ══════════════════════════════════════════════════════════════════════════════
// 4. SPACE INVADERS
// ══════════════════════════════════════════════════════════════════════════════
function initInvaders() {
  const W=500,H=400;
  document.getElementById('modal-body').innerHTML=`<div style="position:relative"><canvas id="ic" width="${W}" height="${H}"></canvas><div id="inv-go" style="display:none" class="game-over-screen"><div class="go-title" id="inv-go-title">GAME OVER</div><div class="go-score" id="inv-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>`;
  const cv=document.getElementById('ic'),ctx=cv.getContext('2d');
  let px=W/2,py=H-40,pw=40,ph=20,pspeed=5,pbullets=[],invaders=[],ibullets=[],score=0,lives=3,running=true,wave=1;
  let leftKey=false,rightKey=false,shootKey=false,lastShot=0,iDir=1,iDropTimer=0;
  function makeWave(){
    invaders=[];
    for(let r=0;r<4;r++)for(let c=0;c<10;c++){
      invaders.push({x:60+c*40,y:50+r*35,w:24,h:16,type:r,alive:true,animFrame:0});
    }
  }
  makeWave();
  window._keyHandler=e=>{
    if(['ArrowLeft','a','A'].includes(e.key))leftKey=true;
    if(['ArrowRight','d','D'].includes(e.key))rightKey=true;
    if([' ','ArrowUp'].includes(e.key)){shootKey=true;e.preventDefault();}
  };
  const ku=e=>{if(['ArrowLeft','a','A'].includes(e.key))leftKey=false;if(['ArrowRight','d','D'].includes(e.key))rightKey=false;if([' '].includes(e.key))shootKey=false;};
  document.addEventListener('keydown',window._keyHandler);
  document.addEventListener('keyup',ku);
  const SHAPES=['👾','👽','🛸','☁️'];
  const COLORS=['#ff0080','#bf00ff','#00f5ff','#39ff14'];
  function drawInvader(inv){
    if(!inv.alive)return;
    ctx.font='18px serif';ctx.textAlign='center';
    ctx.shadowColor=COLORS[inv.type];ctx.shadowBlur=8;
    ctx.fillText(SHAPES[inv.type],inv.x+inv.w/2,inv.y+inv.h);
    ctx.shadowBlur=0;
  }
  function loop(){
    if(!running)return;
    // player
    if(leftKey)px=Math.max(0,px-pspeed);
    if(rightKey)px=Math.min(W-pw,px+pspeed);
    const now=Date.now();
    if(shootKey&&now-lastShot>300){pbullets.push({x:px+pw/2,y:py});lastShot=now;}
    // move invaders
    iDropTimer++;
    const alive=invaders.filter(i=>i.alive);
    if(!alive.length){wave++;makeWave();iDir=1;}
    const speed=Math.max(0.3,1-alive.length/40+wave*0.15);
    if(iDropTimer>40){
      const maxX=Math.max(...alive.map(i=>i.x+i.w));
      const minX=Math.min(...alive.map(i=>i.x));
      if(maxX>W-20||minX<20){iDir*=-1;invaders.forEach(i=>i.y+=12);}
      invaders.forEach(i=>i.alive&&(i.x+=iDir*speed*8));
      iDropTimer=0;
    }
    // invader shoot
    if(Math.random()<0.01+alive.length*0.0002){
      const cols={};
      alive.forEach(i=>{const c=Math.round(i.x/40);if(!cols[c]||i.y>cols[c].y)cols[c]=i;});
      const shooters=Object.values(cols);
      if(shooters.length){const s=shooters[Math.floor(Math.random()*shooters.length)];ibullets.push({x:s.x+s.w/2,y:s.y+s.h});}
    }
    // bullets
    pbullets=pbullets.filter(b=>{b.y-=8;return b.y>0;});
    ibullets=ibullets.filter(b=>{b.y+=4;return b.y<H;});
    // collisions
    pbullets.forEach((b,bi)=>{
      invaders.forEach(inv=>{
        if(inv.alive&&b.x>inv.x&&b.x<inv.x+inv.w&&b.y>inv.y&&b.y<inv.y+inv.h){
          inv.alive=false;pbullets.splice(bi,1);score+=10*(inv.type+1);setScore(score);
        }
      });
    });
    ibullets.forEach((b,bi)=>{
      if(b.x>px&&b.x<px+pw&&b.y>py&&b.y<py+ph){ibullets.splice(bi,1);lives--;if(!lives){running=false;document.getElementById('inv-goscore').textContent=pad(score);document.getElementById('inv-go').style.display='flex';updateStats(score);}}
    });
    // invaders reach bottom
    if(alive.some(i=>i.y+i.h>py)){running=false;document.getElementById('inv-goscore').textContent=pad(score);document.getElementById('inv-go-title').textContent='INVADED!';document.getElementById('inv-go').style.display='flex';updateStats(score);}
    // draw
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    invaders.forEach(drawInvader);
    // player ship
    ctx.fillStyle='#00f5ff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=8;
    ctx.fillRect(px,py,pw,ph);
    ctx.fillRect(px+pw/2-4,py-8,8,8);
    ctx.shadowBlur=0;
    // player bullets
    pbullets.forEach(b=>{ctx.fillStyle='#ffff00';ctx.shadowColor='#ffff00';ctx.shadowBlur=8;ctx.fillRect(b.x-2,b.y,4,12);ctx.shadowBlur=0;});
    // invader bullets
    ibullets.forEach(b=>{ctx.fillStyle='#ff0080';ctx.shadowColor='#ff0080';ctx.shadowBlur=6;ctx.fillRect(b.x-2,b.y,4,10);ctx.shadowBlur=0;});
    // lives
    ctx.font='0.7rem Share Tech Mono';ctx.fillStyle='#00f5ff';ctx.textAlign='left';
    ctx.fillText('LIVES: '+'♥'.repeat(lives), 10, H-10);
    ctx.fillText(`WAVE: ${wave}`, W-90, H-10);
    window._raf=requestAnimationFrame(loop);
  }
  loop();
}

// ══════════════════════════════════════════════════════════════════════════════
// 5. BREAKOUT
// ══════════════════════════════════════════════════════════════════════════════
function initBreakout() {
  const W=480,H=380,PW=70,PH=10,BR=8;
  document.getElementById('modal-body').innerHTML=`<div style="position:relative"><canvas id="brc" width="${W}" height="${H}" style="cursor:none"></canvas><div id="br-go" style="display:none" class="game-over-screen"><div class="go-title" id="br-title">GAME OVER</div><div class="go-score" id="br-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>`;
  const cv=document.getElementById('brc'),ctx=cv.getContext('2d');
  let px=W/2-PW/2,py=H-30,bx=W/2,by=H/2,vx=3,vy=-4,score=0,lives=3,running=false,started=false;
  const ROWS=5,COLS=10,BW=40,BH=16,BPAD=4;
  const BCOLORS=['#ff0080','#ff6600','#ffff00','#39ff14','#00f5ff'];
  let bricks=[];
  function makeBricks(){bricks=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:20+c*(BW+BPAD),y:40+r*(BH+BPAD),row:r,alive:true});}
  makeBricks();
  let mouseX=W/2;
  cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mouseX=e.clientX-r.left;});
  cv.addEventListener('click',()=>{if(!started){started=true;running=true;}});
  window._keyHandler=e=>{
    if(['ArrowLeft','a','A'].includes(e.key))mouseX=Math.max(PW/2,mouseX-15);
    if(['ArrowRight','d','D'].includes(e.key))mouseX=Math.min(W-PW/2,mouseX+15);
    if([' '].includes(e.key)&&!started){started=true;running=true;e.preventDefault();}
    if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
  };
  document.addEventListener('keydown',window._keyHandler);
  function loop(){
    px=Math.max(0,Math.min(W-PW,mouseX-PW/2));
    if(running){
      bx+=vx;by+=vy;
      if(bx-BR<0||bx+BR>W)vx*=-1;
      if(by-BR<0)vy*=-1;
      if(by+BR>py&&by+BR<py+PH+10&&bx>px&&bx<px+PW){vy=-Math.abs(vy);vx+=(bx-(px+PW/2))*0.05;}
      bricks.forEach((b,i)=>{
        if(b.alive&&bx+BR>b.x&&bx-BR<b.x+BW&&by+BR>b.y&&by-BR<b.y+BH){
          b.alive=false;score+=10*(ROWS-b.row);setScore(score);
          const cx=bx-(b.x+BW/2),cy=by-(b.y+BH/2);
          if(Math.abs(cx/BW)>Math.abs(cy/BH))vx*=-1;else vy*=-1;
        }
      });
      if(by-BR>H){lives--;if(!lives){running=false;document.getElementById('br-title').textContent='GAME OVER';document.getElementById('br-goscore').textContent=pad(score);document.getElementById('br-go').style.display='flex';updateStats(score);}else{bx=W/2;by=H/2;vx=3;vy=-4;started=false;running=false;}}
      if(bricks.every(b=>!b.alive)){running=false;document.getElementById('br-title').textContent='YOU WIN!';document.getElementById('br-goscore').textContent=pad(score);document.getElementById('br-go').style.display='flex';updateStats(score);}
    }
    // draw
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{if(!b.alive)return;const c=BCOLORS[b.row];ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=5;ctx.fillRect(b.x,b.y,BW,BH);ctx.shadowBlur=0;});
    ctx.fillStyle='#00f5ff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=8;ctx.fillRect(px,py,PW,PH);ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(bx,by,BR,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
    if(!started){ctx.font="0.7rem 'Share Tech Mono'";ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText('CLICK OR PRESS SPACE TO START',W/2,H/2);}
    ctx.font="0.65rem 'Share Tech Mono'";ctx.textAlign='left';ctx.fillStyle='#7070a0';ctx.fillText('LIVES: '+'●'.repeat(lives),10,H-8);
    window._raf=requestAnimationFrame(loop);
  }
  loop();
}

// ══════════════════════════════════════════════════════════════════════════════
// 6. FLAPPY BIRD
// ══════════════════════════════════════════════════════════════════════════════
function initFlappy() {
  const W=360,H=480,GAP=130,PW=50;
  document.getElementById('modal-body').innerHTML=`<div style="position:relative"><canvas id="fc" width="${W}" height="${H}"></canvas><div id="fl-go" style="display:none" class="game-over-screen"><div class="go-title">GAME OVER</div><div class="go-score" id="fl-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>`;
  const cv=document.getElementById('fc'),ctx=cv.getContext('2d');
  let by=H/2,bvy=0,pipes=[],score=0,running=false,started=false,frame=0;
  const GRAV=0.45,JUMP=-8,BSIZE=24;
  function addPipe(){const gap=60+Math.random()*(H-200);pipes.push({x:W,top:gap-GAP/2,bot:gap+GAP/2,scored:false});}
  function flap(){if(!started){started=true;running=true;}bvy=JUMP;}
  cv.addEventListener('click',flap);
  window._keyHandler=e=>{if(e.key===' '||e.key==='ArrowUp'){flap();e.preventDefault();}};
  document.addEventListener('keydown',window._keyHandler);
  addPipe();
  function loop(){
    frame++;
    if(running){
      bvy+=GRAV;by+=bvy;by=Math.max(BSIZE,by);
      if(frame%90===0)addPipe();
      pipes=pipes.filter(p=>p.x>-PW);
      pipes.forEach(p=>{p.x-=2.5;if(!p.scored&&p.x+PW<120){p.scored=true;score++;setScore(score);}});
      // collision
      pipes.forEach(p=>{if(120+BSIZE>p.x&&120-BSIZE<p.x+PW&&(by-BSIZE<p.top||by+BSIZE>p.bot)){die();}});
      if(by+BSIZE>H-40){die();}
    }
    // draw
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    // bg stars
    ctx.fillStyle='rgba(255,255,255,0.5)';
    for(let i=0;i<20;i++){ctx.fillRect((i*97+frame*0.3)%W,(i*67)%H,1,1);}
    // pipes
    pipes.forEach(p=>{
      ctx.fillStyle='#39ff14';ctx.shadowColor='#39ff14';ctx.shadowBlur=8;
      ctx.fillRect(p.x,0,PW,p.top);
      ctx.fillRect(p.x,p.bot,PW,H-p.bot-40);
      ctx.shadowBlur=0;
      ctx.fillStyle='#2aef04';ctx.fillRect(p.x-4,p.top-20,PW+8,20);ctx.fillRect(p.x-4,p.bot,PW+8,20);
    });
    // ground
    ctx.fillStyle='#1a3a0a';ctx.fillRect(0,H-40,W,40);
    // bird
    const tilt=Math.atan2(bvy,10);
    ctx.save();ctx.translate(120,by);ctx.rotate(tilt);
    ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor='#ffff00';ctx.shadowBlur=10;ctx.fillText('🐦',0,0);
    ctx.shadowBlur=0;ctx.restore();
    // score
    ctx.font="bold 1.2rem 'Orbitron'";ctx.textAlign='center';ctx.fillStyle='#ffff00';
    ctx.shadowColor='#ffff00';ctx.shadowBlur=8;ctx.fillText(score,W/2,40);ctx.shadowBlur=0;
    if(!started){ctx.font="0.65rem 'Share Tech Mono'";ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fillText('TAP OR PRESS SPACE',W/2,H/2+60);}
    window._raf=requestAnimationFrame(loop);
  }
  function die(){running=false;started=false;document.getElementById('fl-goscore').textContent=pad(score);document.getElementById('fl-go').style.display='flex';updateStats(score);}
  loop();
}

// ══════════════════════════════════════════════════════════════════════════════
// 7. 2048
// ══════════════════════════════════════════════════════════════════════════════
function init2048() {
  document.getElementById('modal-body').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><div class="g2048-board" id="board2048"></div><div id="g2048-msg" style="font-family:'Press Start 2P',monospace;font-size:0.7rem;min-height:1rem"></div></div>`;
  let grid=Array.from({length:4},()=>Array(4).fill(0)),score=0;
  function addRandom(){const empty=[];grid.forEach((r,y)=>r.forEach((v,x)=>{if(!v)empty.push([x,y]);}));if(!empty.length)return;const[x,y]=empty[Math.floor(Math.random()*empty.length)];grid[y][x]=Math.random()<0.9?2:4;}
  function render(){
    const b=document.getElementById('board2048');b.innerHTML='';
    grid.forEach(row=>row.forEach(v=>{const c=document.createElement('div');c.className='g2048-cell';c.dataset.v=v;c.textContent=v||'';b.appendChild(c);}));
    setScore(score);
    if(grid.some(r=>r.some(v=>v===2048)))document.getElementById('g2048-msg').textContent='🎉 YOU WIN! 🎉';
  }
  function slide(row){let r=row.filter(v=>v);for(let i=0;i<r.length-1;i++){if(r[i]===r[i+1]){r[i]*=2;score+=r[i];r.splice(i+1,1);}}while(r.length<4)r.push(0);return r;}
  function move(dir){
    let changed=false;
    if(dir==='left')grid=grid.map(r=>{const n=slide(r);if(n.join()!==r.join())changed=true;return n;});
    else if(dir==='right')grid=grid.map(r=>{const n=slide([...r].reverse()).reverse();if(n.join()!==r.join())changed=true;return n;});
    else if(dir==='up'){const t=grid[0].map((_,c)=>grid.map(r=>r[c]));const nt=t.map(c=>slide(c));nt.forEach((c,ci)=>c.forEach((v,ri)=>{if(grid[ri][ci]!==v)changed=true;grid[ri][ci]=v;}));}
    else if(dir==='down'){const t=grid[0].map((_,c)=>grid.map(r=>r[c]).reverse());const nt=t.map(c=>slide(c).reverse());nt.forEach((c,ci)=>c.forEach((v,ri)=>{if(grid[ri][ci]!==v)changed=true;grid[ri][ci]=v;}));}
    if(changed){addRandom();render();}
  }
  addRandom();addRandom();render();
  window._keyHandler=e=>{
    const map={'ArrowLeft':'left','ArrowRight':'right','ArrowUp':'up','ArrowDown':'down','a':'left','d':'right','w':'up','s':'down','A':'left','D':'right','W':'up','S':'down'};
    if(map[e.key]){move(map[e.key]);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault();}
  };
  document.addEventListener('keydown',window._keyHandler);
  // touch
  let tx0=0,ty0=0;
  document.getElementById('board2048').addEventListener('touchstart',e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
  document.getElementById('board2048').addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tx0,dy=e.changedTouches[0].clientY-ty0;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// 8. MEMORY MATCH
// ══════════════════════════════════════════════════════════════════════════════
function initMemory() {
  const EMOJIS=['🎮','🚀','⚡','🌈','🎯','🏆','💎','🔥'];
  const cards=[...EMOJIS,...EMOJIS].sort(()=>Math.random()-0.5);
  let flipped=[],matched=[],moves=0,canFlip=true;
  document.getElementById('modal-body').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><div style="font-size:0.7rem;color:#7070a0">MOVES: <span id="mmoves">0</span></div><div class="memory-board" id="memboard" style="perspective:600px"></div></div>`;
  const board=document.getElementById('memboard');
  function render(){
    board.innerHTML='';
    cards.forEach((em,i)=>{
      const c=document.createElement('div');c.className='mem-card';
      if(flipped.includes(i)||matched.includes(i))c.classList.add(matched.includes(i)?'matched':'flipped');
      c.innerHTML=`<div class="mem-card-front"><span style="font-size:1.8rem">❓</span></div><div class="mem-card-back"><span style="font-size:2rem">${em}</span></div>`;
      c.addEventListener('click',()=>flip(i));
      board.appendChild(c);
    });
  }
  function flip(i){
    if(!canFlip||flipped.includes(i)||matched.includes(i)||flipped.length>=2)return;
    flipped.push(i);moves++;document.getElementById('mmoves').textContent=moves;
    if(flipped.length===2){
      canFlip=false;
      setTimeout(()=>{
        if(cards[flipped[0]]===cards[flipped[1]]){matched.push(...flipped);setScore(Math.max(0,500-moves*10));}
        flipped=[];canFlip=true;render();
        if(matched.length===16){updateStats(Math.max(0,500-moves*10));}
      },700);
    }
    render();
  }
  render();
}

// ══════════════════════════════════════════════════════════════════════════════
// 9. WHACK-A-MOLE
// ══════════════════════════════════════════════════════════════════════════════
function initWam() {
  document.getElementById('modal-body').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <div style="font-family:Orbitron,sans-serif;font-size:1.5rem;color:#ffff00;text-shadow:0 0 8px #ffff00" id="wam-timer">30</div>
      <div class="wam-grid" id="wamgrid"></div>
      <div id="wam-go" style="display:none;position:absolute;inset:0" class="game-over-screen"><div class="go-title">TIME UP!</div><div class="go-score" id="wam-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div>
    </div>`;
  document.getElementById('modal-body').style.position='relative';
  const MOLES=['🐹','🐭','🦔','🐿️','🦫'];
  let holes=Array(9).fill(false),score=0,timeLeft=30,running=true;
  const grid=document.getElementById('wamgrid');
  for(let i=0;i<9;i++){
    const h=document.createElement('div');h.className='hole';h.id=`hole${i}`;
    h.innerHTML=`<span class="mole">${MOLES[i%MOLES.length]}</span>`;
    h.addEventListener('click',()=>{if(holes[i]){score+=10;setScore(score);h.classList.remove('active');holes[i]=false;}});
    grid.appendChild(h);
  }
  function showMole(){if(!running)return;const empty=Array.from({length:9},(_,i)=>i).filter(i=>!holes[i]);if(!empty.length)return;const idx=empty[Math.floor(Math.random()*empty.length)];holes[idx]=true;document.getElementById(`hole${idx}`).classList.add('active');setTimeout(()=>{if(holes[idx]){holes[idx]=false;document.getElementById(`hole${idx}`).classList.remove('active');}},900+Math.random()*700);}
  const moleInt=setInterval(showMole,600);
  window._gameTimer=setInterval(()=>{
    timeLeft--;document.getElementById('wam-timer').textContent=timeLeft;
    if(timeLeft<=0){running=false;clearInterval(moleInt);clearInterval(window._gameTimer);document.getElementById('wam-goscore').textContent=pad(score);document.getElementById('wam-go').style.display='flex';updateStats(score);}
  },1000);
}

// ══════════════════════════════════════════════════════════════════════════════
// 10. MAZE RUNNER
// ══════════════════════════════════════════════════════════════════════════════
function initMaze() {
  const COLS=19,ROWS=15,CS=26;
  const W=COLS*CS,H=ROWS*CS;
  document.getElementById('modal-body').innerHTML=`<div style="position:relative"><canvas id="mzc" width="${W}" height="${H}"></canvas><div id="mz-go" style="display:none" class="game-over-screen"><div class="go-title">🎉 ESCAPED!</div><div class="go-score" id="mz-goscore">0</div><button class="go-btn" onclick="restartGame()">▶ PLAY AGAIN</button></div></div>`;
  const cv=document.getElementById('mzc'),ctx=cv.getContext('2d');
  // Generate maze with DFS
  const cells=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>({visited:false,walls:{N:true,S:true,E:true,W:true}})));
  function dfs(cx,cy){
    cells[cy][cx].visited=true;
    const dirs=[['N',0,-1],['S',0,1],['E',1,0],['W',-1,0]].sort(()=>Math.random()-0.5);
    dirs.forEach(([d,dx,dy])=>{const nx=cx+dx,ny=cy+dy;if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!cells[ny][nx].visited){cells[cy][cx].walls[d]=false;const opp={N:'S',S:'N',E:'W',W:'E'}[d];cells[ny][nx].walls[opp]=false;dfs(nx,ny);}});
  }
  dfs(0,0);
  let px=0,py=0,steps=0,startTime=Date.now();
  function draw(){
    ctx.fillStyle='#050510';ctx.fillRect(0,0,W,H);
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
      const c=cells[y][x],cx=x*CS,cy=y*CS;
      ctx.strokeStyle='#bf00ff';ctx.shadowColor='#bf00ff';ctx.shadowBlur=4;ctx.lineWidth=1.5;
      if(c.walls.N){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+CS,cy);ctx.stroke();}
      if(c.walls.S){ctx.beginPath();ctx.moveTo(cx,cy+CS);ctx.lineTo(cx+CS,cy+CS);ctx.stroke();}
      if(c.walls.W){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+CS);ctx.stroke();}
      if(c.walls.E){ctx.beginPath();ctx.moveTo(cx+CS,cy);ctx.lineTo(cx+CS,cy+CS);ctx.stroke();}
      ctx.shadowBlur=0;
    }
    // exit
    ctx.fillStyle='rgba(57,255,20,0.2)';ctx.fillRect((COLS-1)*CS+1,(ROWS-1)*CS+1,CS-2,CS-2);
    ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🏁',(COLS-0.5)*CS,(ROWS-0.3)*CS);
    // player
    const gx=(px+0.5)*CS,gy=(py+0.5)*CS;
    ctx.beginPath();ctx.arc(gx,gy,CS/2-4,0,Math.PI*2);ctx.fillStyle='#00f5ff';ctx.shadowColor='#00f5ff';ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;
    ctx.font='13px serif';ctx.textAlign='center';ctx.fillText('😊',gx,gy+5);
  }
  window._keyHandler=e=>{
    const map={ArrowUp:'N',ArrowDown:'S',ArrowLeft:'W',ArrowRight:'E',w:'N',s:'S',a:'W',d:'E',W:'N',S:'S',A:'W',D:'E'};
    const dir=map[e.key];if(!dir)return;
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();
    if(cells[py][px].walls[dir])return;
    const mv={N:[0,-1],S:[0,1],W:[-1,0],E:[1,0]}[dir];
    px+=mv[0];py+=mv[1];steps++;
    const elapsed=Math.round((Date.now()-startTime)/1000);
    setScore(steps);
    if(px===COLS-1&&py===ROWS-1){
      const sc=Math.max(0,1000-steps*5-elapsed*2);
      setScore(sc);
      document.getElementById('mz-goscore').textContent=pad(sc);
      document.getElementById('mz-go').style.display='flex';
      updateStats(sc);
      document.removeEventListener('keydown',window._keyHandler);
    }
    draw();
  };
  document.addEventListener('keydown',window._keyHandler);
  draw();
}
</script>
